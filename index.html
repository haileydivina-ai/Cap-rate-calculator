<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cap Rate Tracker</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f5f7;color:#202124}
  .app{max-width:520px;margin:auto;min-height:100vh;background:white}
  header{padding:24px 20px 18px;background:#111;color:white}
  header h1{margin:0;font-size:25px;letter-spacing:.3px}
  header p{margin:6px 0 0;color:#cfd2d6;font-size:13px}
  main{padding:18px}
  label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}
  input{width:100%;padding:13px 12px;border:1px solid #d7d9dd;border-radius:10px;font-size:16px;background:#fff}
  .field{margin-bottom:13px}
  .section{margin-top:22px}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:1px;font-weight:800;color:#666;margin-bottom:10px}
  .card{border:1px solid #e1e3e6;border-radius:14px;padding:15px;margin-bottom:12px}
  .cap{background:#111;color:white;text-align:center;padding:20px;border-radius:16px;margin:16px 0}
  .cap .small{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#c9c9c9}
  .cap .value{font-size:44px;font-weight:800;margin-top:5px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:#f7f7f8;border-radius:12px;padding:14px}
  .stat .name{font-size:12px;color:#666}
  .stat .num{font-size:25px;font-weight:800;margin-top:5px}
  .mix{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
  .mix:last-child{border-bottom:0}
  .mix strong{font-size:20px}
  button{width:100%;border:0;border-radius:11px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;background:#111;color:#fff;margin-top:8px}
  button.secondary{background:#eceef1;color:#222}
  .good{color:#16803c}
  .warn{color:#a15c00}
  .foot{font-size:11px;color:#777;text-align:center;padding:8px 0 24px}
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#111111"></head>
<body>
<div class="app">
<header>
  <h1>CAP RATE TRACKER</h1>
  <p>Premium performance calculator</p>
</header>
<main>
  <div class="field">
    <label>Location</label>
    <input id="location" value="CA-1038">
  </div>

  <div class="section">
    <div class="section-title">Daily numbers</div>
    <div class="card">
      <div class="field"><label>Sign-ups + Reactivations</label><input id="signups" type="number" min="0" value="16"></div>
      <div class="field"><label>Retail washes</label><input id="retail" type="number" min="0" value="91"></div>
      <div class="field"><label>Rewash / Requeue / EE washes</label><input id="rewash" type="number" min="0" value="2"></div>
      <div class="field"><label>House account charges</label><input id="house" type="number" min="0" value="6"></div>
    </div>
  </div>

  <div class="cap">
    <div class="small">Cap Rate</div>
    <div class="value" id="cap">0.00%</div>
  </div>

  <div class="section">
    <div class="section-title">Premium stats</div>
    <div class="grid">
      <div class="stat"><div class="name">Titanium sign-ups</div><div class="num" id="titaniumCount">4</div></div>
      <div class="stat"><div class="name">Platinum sign-ups</div><div class="num" id="platinumCount">2</div></div>
    </div>
    <div class="card" style="margin-top:10px">
      <div class="field"><label>Titanium sign-ups</label><input id="titanium" type="number" min="0" value="4"></div>
      <div class="field"><label>Platinum sign-ups</label><input id="platinum" type="number" min="0" value="2"></div>
      <div class="mix"><span>Titanium Mix</span><strong id="titaniumMix">0.00%</strong></div>
      <div class="mix"><span>Premium Mix</span><strong id="premiumMix">0.00%</strong></div>
    </div>
  </div>

  <button onclick="calculate()">Calculate</button>
  <button class="secondary" onclick="resetApp()">Reset</button>
  <div class="foot">Prototype based on the uploaded Cap Rate Calculator spreadsheet.</div>
</main>
</div>

<script>
function n(id){ return Number(document.getElementById(id).value) || 0; }
function pct(x){ return (x*100).toFixed(2) + "%"; }

function calculate(){
  const signups=n("signups"), retail=n("retail"), rewash=n("rewash"), house=n("house");
  const titanium=n("titanium"), platinum=n("platinum");
  const denominator=(signups+retail)-(rewash+house);
  const cap=denominator ? signups/denominator : 0;
  const titaniumMix=signups ? titanium/signups : 0;
  const premiumMix=signups ? (titanium+platinum)/signups : 0;

  document.getElementById("cap").textContent=pct(cap);
  document.getElementById("titaniumMix").textContent=pct(titaniumMix);
  document.getElementById("premiumMix").textContent=pct(premiumMix);
  document.getElementById("titaniumCount").textContent=titanium;
  document.getElementById("platinumCount").textContent=platinum;
}
function resetApp(){
  document.getElementById("location").value="CA-1038";
  document.getElementById("signups").value=16;
  document.getElementById("retail").value=91;
  document.getElementById("rewash").value=2;
  document.getElementById("house").value=6;
  document.getElementById("titanium").value=4;
  document.getElementById("platinum").value=2;
  calculate();
}
document.querySelectorAll("input").forEach(x=>x.addEventListener("input",calculate));
calculate();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js")}</script>
</body>
</html>
